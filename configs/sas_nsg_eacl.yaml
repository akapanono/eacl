# Example SAS-NSG-EACL experiment configuration.
# The training script still uses argparse; this file is a readable record of
# the intended switches and default weights.

model: SAS-NSG-EACL

neutral_decoupling:
  use_neutral_decoupling: true
  neutral_label_name: neutral
  lambda_neu: 0.5

speaker_state_guidance:
  use_speaker_state: true
  speaker_state_encoder: shared
  speaker_state_pooling: mean
  speaker_state_max_len: 64
  use_state_fusion: true
  use_state_in_domain_gate: true
  missing_state_text:
    mental_state: unknown.
    interaction_relation: unknown.
    expression_style: unknown.
    context_shift: unknown.

similar_anchor_separation:
  use_similar_anchor_separation: true
  similar_emotion_pairs:
    - [happy, excited]
    - [sad, frustrated]
    - [angry, frustrated]
  sas_margin: 0.30
  lambda_sas: 0.02

hard_anchor_negative:
  use_hard_anchor_negative: true
  hard_negative_rho: 2.0
  hard_negative_temperature: 0.07
  lambda_hard: 0.05

loss:
  lambda_supcon: 1.0
  lambda_angle: 0.05
