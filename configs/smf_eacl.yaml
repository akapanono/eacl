model: SMF-EACL

dataset_name: IEMOCAP
epochs: 30
seed: 4668

backbone:
  bert_path: pretrained/sup-simcse-roberta-large
  anchor_path: emo_anchors/sup-simcse-roberta-large

training:
  batch_size: 16
  accumulation_step: 1
  lr: 5e-5
  ptmlr: 5e-6
  dropout: 0.25
  temp: 0.3
  lr_scheduler: cosine
  warmup_ratio: 0.08
  max_grad_norm: 0.5
  early_stop_patience: 5
  early_stop_metric: valid
  save_best_metric: valid
  class_balanced_ce: true

anchors:
  num_subanchors: 4
  prototype_pooling: domain_gated
  prototype_momentum: 0.995
  freeze_prototype_epochs: 3
  normalize_prototypes_after_update: true
  prototype_update_policy: validation_guarded
  prototype_stop_update_patience: 2

speaker_memory:
  use_speaker_memory: true
  use_speaker_state: false
  speaker_memory_k: 3
  speaker_memory_pooling: attention
  speaker_memory_max_len: 128

fusion:
  use_classifier_prototype_fusion: true
  fusion_type: adaptive
  fusion_alpha: 0.5

loss:
  use_neutral_decoupling: true
  use_neutral_aware_supcon: true
  lambda_neu: 0.2
  lambda_supcon: 0.2
  lambda_neu_cl: 0.1
  lambda_emo_cl: 0.2
  lambda_angle: 0.01
  lambda_sas: 0.002
  lambda_hard: 0.005
  lambda_gate_entropy: 0.001

similar_emotion:
  use_similar_anchor_separation: true
  similar_emotion_pairs:
    - happy:excited
    - sad:frustrated
    - angry:frustrated
  sas_margin: 0.3

hard_negative:
  use_hard_anchor_negative: true
  hard_negative_schedule: curriculum
  hard_negative_temperature: 0.2
  hard_rho_warmup: 0.0
  hard_rho_mild: 0.2
  hard_rho_full: 0.5
  hard_warmup_epochs: 3
  hard_mild_epochs: 8
